name: Tests

on:
  push:
    paths:
      - "instagram_username_discovery/**"
  pull_request:
    paths:
      - "instagram_username_discovery/**"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram_username_discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python -m username_discovery stats
